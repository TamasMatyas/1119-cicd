name: Python Ci/Cd
on: [push, pull_request]

jobs:
  run-and-test:
    runs-on: ubuntu-latest
    steps:
      - users: actions/chechout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: run pytest
        run: pytest
      - name: Test main.py
        run: python main.py 